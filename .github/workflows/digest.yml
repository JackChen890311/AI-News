name: Daily AI News Digest

on:
  schedule:
    - cron: "25 22 * * *" # UTC = 06:25 Asia/Taipei。
    - cron: "25 10 * * *" # UTC = 18:25 Asia/Taipei。
  workflow_dispatch:
    inputs:
      force:
        description: "重新產生今天的摘要（忽略既有 digests/YYYY-MM-DD.md）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # cmd_digest 用 datetime.now().astimezone()，沒設 TZ 會變成 UTC 日期。
      TZ: Asia/Taipei
      AI_NEWS_PROVIDER: api
      AI_NEWS_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai/
      # 想換模型就到 Settings → Variables 設 AI_NEWS_MODEL，不用改這個檔案。
      AI_NEWS_MODEL: ${{ vars.AI_NEWS_MODEL || 'gemini-3.5-flash' }}
      # 免費層被限流或該模型額度用完時，自動換這個模型重試。
      AI_NEWS_FALLBACK_MODELS: ${{ vars.AI_NEWS_FALLBACK_MODELS || 'gemini-3.5-flash-lite' }}
      AI_NEWS_API_RETRIES: "4"
      AI_NEWS_API_RETRY_MAX: "20"
      # 回覆格式不對時，同一個模型降溫重試的次數（之後才換模型）。
      AI_NEWS_JSON_RETRIES: "2"
      AI_NEWS_MAX_TOKENS: "2048"
      # 全域時間預算：13 分鐘。job timeout 20 分鐘，留時間給抓取、build、commit。
      AI_NEWS_TIME_BUDGET: "780"
      # 免費層對「每分鐘請求數」很敏感，平行 2 個比 4 個穩。
      AI_NEWS_CONCURRENCY: "2"
      AI_NEWS_SUMMARY_TIMEOUT: "60"
      AI_NEWS_API_KEY: ${{ secrets.AI_NEWS_API_KEY }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Generate digest
        id: digest
        run: |
          TODAY=$(date +%F)
          if [ "$FORCE" != "true" ] && [ -f "digests/${TODAY}.md" ]; then
            echo "digests/${TODAY}.md 已存在，跳過產生（workflow_dispatch 勾 force 可重跑）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_digest() {
            if [ "$FORCE" = "true" ]; then
              uv run python -m ai_news digest --force
            else
              uv run python -m ai_news digest
            fi
          }
          # 整體流程失敗（例如 API 全部掛掉）時再試一次；個別摘要失敗
          # 已經有擷取式保底，不會走到這裡。
          if ! run_digest; then
            echo "第一次產生失敗，30 秒後重試（--force）…"
            sleep 30
            uv run python -m ai_news digest --force
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build site data
        if: steps.digest.outputs.skip != 'true'
        run: uv run python scripts/build.py

      - name: Commit and push
        if: steps.digest.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests data/news.json
          if git diff --cached --quiet; then
            echo "沒有變更，略過 commit。"
            exit 0
          fi
          git commit -m "Update daily digest $(date +%F)"
          git push
