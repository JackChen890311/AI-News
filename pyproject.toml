[project]
name = "ai-news"
version = "0.1.0"
description = "每日 AI 新聞摘要：多來源收集、排序、去重，用 OpenCode CLI 產生繁中摘要，輸出 Obsidian-friendly Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "rich>=13.0",
]

[project.scripts]
ai-news = "ai_news.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# 只把這個專案當依賴清單用（不在 venv 装 editable package）。
# CLI 一律用 `uv run python -m ai_news ...` 從 repo 根目錄執行。
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_news"]
